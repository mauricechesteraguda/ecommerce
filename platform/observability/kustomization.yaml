apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alertmanager-config.yaml
  - externalsecret.yaml
  - rules.yaml
  - grafana-datasources.yaml
configMapGenerator:
  - name: grafana-provisioned-dashboards
    files:
      - dashboards/cluster-health.json
      - dashboards/backend-red.json
      - dashboards/slo-error-budget.json
      - dashboards/readiness-checkout-ingress.json
generatorOptions: { disableNameSuffixHash: true }
