# Receivers stay inert until ExternalSecret-backed placeholders are configured.
apiVersion: v1
kind: ConfigMap
metadata: { name: alertmanager-routing }
data:
  alertmanager.yaml: |
    route:
      receiver: disabled
      group_by: [alertname, namespace, workload]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: disabled
    inhibit_rules:
      - source_matchers: ['severity="critical"']
        target_matchers: ['severity=~"warning|info"']
        equal: [alertname, namespace]
