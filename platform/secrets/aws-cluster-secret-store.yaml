apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: aguda-provider, annotations: { argocd.argoproj.io/sync-wave: "20" } }
spec:
  provider:
    aws:
      service: SecretsManager
      region: "${AWS_REGION}"
      auth:
        jwt:
          serviceAccountRef: { name: aguda-secrets, namespace: "aguda-${ENVIRONMENT}" }
      # The service account is annotated by Terraform-created IRSA; no access keys.
      dataFrom: []
