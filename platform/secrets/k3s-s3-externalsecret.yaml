# security-10042026-Maurice: Hetzner k3s has no workload identity; values are supplied out of band.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aguda-backup-s3
  namespace: aguda
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aguda-k3s-s3, kind: SecretStore }
  target: { name: aguda-backup-s3, creationPolicy: Owner }
  data:
    - { secretKey: AWS_ACCESS_KEY_ID, remoteRef: { key: AWS_ACCESS_KEY_ID } }
    - { secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: { key: AWS_SECRET_ACCESS_KEY } }
    - { secretKey: AWS_ENDPOINT_URL, remoteRef: { key: AWS_ENDPOINT_URL } }
