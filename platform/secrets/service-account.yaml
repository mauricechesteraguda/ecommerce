apiVersion: v1
kind: ServiceAccount
metadata:
  name: aguda-secrets
  annotations:
    # Provider overlays must set exactly one of these identity annotations.
    eks.amazonaws.com/role-arn: ${AWS_IRSA_ROLE_ARN}
    iam.gke.io/gcp-service-account: ${GCP_WORKLOAD_SERVICE_ACCOUNT}
    azure.workload.identity/client-id: ${AZURE_WORKLOAD_CLIENT_ID}
    azure.workload.identity/tenant-id: ${AZURE_TENANT_ID}
  labels: { azure.workload.identity/use: "true" }
