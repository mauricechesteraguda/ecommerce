# security-10042026-Maurice: application secret contract; no values or static credentials.
{{- if .Values.providerVaultKeys }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aguda-deskworks-runtime
  namespace: {{ .Release.Namespace }}
  annotations: { argocd.argoproj.io/sync-wave: "20" }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aguda-provider, kind: ClusterSecretStore }
  target: { name: aguda-deskworks-runtime, creationPolicy: Owner }
  data:
    - { secretKey: DATABASE_URL, remoteRef: { key: database-url } }
    - { secretKey: REDIS_URL, remoteRef: { key: redis-url } }
    - { secretKey: SESSION_SECRET, remoteRef: { key: session-secret } }
    - { secretKey: JWT_SECRET, remoteRef: { key: jwt-secret } }
    - { secretKey: COOKIE_SECRET, remoteRef: { key: cookie-secret } }
    - { secretKey: METRICS_TOKEN, remoteRef: { key: metrics-token } }
    - { secretKey: STRIPE_SECRET_KEY, remoteRef: { key: stripe-secret-key } }
    - { secretKey: RESEND_API_KEY, remoteRef: { key: resend-api-key } }
{{- else if eq .Values.environment "k3s" }}
apiVersion: v1
kind: Secret
metadata: { name: aguda-deskworks-runtime, namespace: {{ .Release.Namespace }} }
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgres@aguda-deskworks-postgresql:5432/aguda"
  REDIS_URL: "redis://:redis@aguda-deskworks-redis-master:6379"
  SESSION_SECRET: "k3s-deterministic-session-double"
  JWT_SECRET: "k3s-deterministic-jwt-double"
  COOKIE_SECRET: "k3s-deterministic-cookie-double"
  METRICS_TOKEN: "k3s-deterministic-metrics-double"
  STRIPE_SECRET_KEY: "sk_test_deterministic_double"
  RESEND_API_KEY: "re_deterministic_double"
{{- end }}
