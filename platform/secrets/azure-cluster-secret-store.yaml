apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: aguda-provider, annotations: { argocd.argoproj.io/sync-wave: "20" } }
spec:
  provider:
    azurekv:
      vaultUrl: "https://${AZURE_KEY_VAULT_NAME}.vault.azure.net"
      authType: WorkloadIdentity
      serviceAccountRef: { name: aguda-secrets, namespace: "aguda-${ENVIRONMENT}" }
