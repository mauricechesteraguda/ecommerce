# security-10042026-Maurice: Ticket 06 shared platform layer; no cloud credentials in GitOps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: platform-supply-chain, namespace: argocd, annotations: { argocd.argoproj.io/sync-wave: "10" } }
spec:
  project: platform
  source: { repoURL: "https://github.com/aguda/ecommerce.git", targetRevision: main, path: platform/supply-chain }
  destination: { name: in-cluster, namespace: kyverno }
  syncPolicy: { automated: { prune: false, selfHeal: false }, syncOptions: [CreateNamespace=true] }
